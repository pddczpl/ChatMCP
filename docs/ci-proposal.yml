name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-tests:
    name: Hub tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        shell: bash
        working-directory: CHATMCP-HUB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Python is only needed by the FastAPI end-to-end suite. Without it that suite reports SKIP (never PASS).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python packages for the FastAPI end-to-end suite
        run: python -m pip install -r tests/requirements-e2e.txt
      - name: Configure Git identity for tests that create repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: Syntax check
        run: |
          for f in hub.mjs lib/*.mjs tests/*.mjs tests/e2e/*.mjs tests/mutation/*.mjs web/ui-logic.js web/onboarding.js web/react-app.js; do node --check "$f"; done
          python -m py_compile tests/*.py
      # --no-skip: this job installs Git, a shell and Python, so no suite may be skipped; a skip is reported as a failure.
      - name: Run all suites
        run: node tests/run-all.mjs --no-skip all --json test-results/summary.json
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-test-summary-${{ matrix.os }}-node${{ matrix.node }}
          path: CHATMCP-HUB/test-results/summary.json
          if-no-files-found: ignore

  # The browser suites need Chromium, so they run on one OS only. verify-ui-e2e.py starts a real Hub and drives the
  # first-run wizard and the approval flow in a real browser against a scripted model.
  ui-tests:
    name: Browser UI suites (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: CHATMCP-HUB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r tests/requirements-ui.txt
          python -m playwright install --with-deps chromium
      - name: Configure Git identity for tests that create repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: Run the UI suites
        run: node tests/run-all.mjs --python --filter ui --no-skip all --json test-results/ui-summary.json
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-summary
          path: CHATMCP-HUB/test-results/ui-summary.json
          if-no-files-found: ignore

  script-tests:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Bootstrap script (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/tests/test-bootstrap.sh
      - name: Bootstrap and token-rotation scripts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\scripts\tests\Test-Bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\tests\Test-RotateToken.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No tracked file may match an ignore rule
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked files that .gitignore says must not be committed:"
            echo "$tracked_ignored" | head -50
            exit 1
          fi
      - name: No bearer tokens or private keys in tracked files
        run: |
          if git grep -I -n -E 'Authorization"?[:=] *"?Bearer [A-Za-z0-9._~+/=-]{24,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' -- . ':(exclude)scripts/tests' ':(exclude)docs'; then
            echo "A credential-looking value is tracked. Remove it and rotate the credential."
            exit 1
          fi
