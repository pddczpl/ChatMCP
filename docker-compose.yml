# ChatMCP Docker Compose Configuration
# For self-hosting on VPS / Linux servers
services:
  chatmcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatmcp:latest
    container_name: chatmcp
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:10000"
    environment:
      - NODE_ENV=production
      - CHATMCP_PUBLIC=1
      - CHATMCP_EXEC_MODE=broker
      - CHATMCP_DATA_ROOT=/var/lib/chatmcp
      - CHATMCP_NO_HOOKS_DIR=/opt/chatmcp/no-hooks
      - PORT=10000
      - CHATMCP_OWNER_TOKEN=${CHATMCP_OWNER_TOKEN:?CHATMCP_OWNER_TOKEN is required (min 32 chars, min 12 distinct)}
      - CHATMCP_ALLOWED_HOSTS=${CHATMCP_ALLOWED_HOSTS:-localhost:10000,127.0.0.1:10000}
      - CHATMCP_ALLOW_INSECURE_HTTP=${CHATMCP_ALLOW_INSECURE_HTTP:-0}
      - CHATMCP_TRUSTED_PROXY_HOPS=${CHATMCP_TRUSTED_PROXY_HOPS:-0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHATMCP_AI_PRESET=${CHATMCP_AI_PRESET:-}
      - CHATMCP_AI_MODEL=${CHATMCP_AI_MODEL:-}
    volumes:
      - chatmcp-data:/var/lib/chatmcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  chatmcp-data:
    name: chatmcp_data
