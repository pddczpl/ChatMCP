name: CI

# One run per push (docs/CI-HEALTH.md): a branch with an open pull request is built by the pull_request event only, so `push` is
# limited to main (the merge) and a branch without a pull request is not built until the person opens one or starts this workflow by hand.
# A documentation-only change skips this workflow; docs-gates.yml runs exactly then (its `paths` list equals the `paths-ignore` list
# below, tests/verify-ci-triggers.mjs checks that) so the suites that read the documents still run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'HUONG-DAN.txt'
      - 'VALIDATION.txt'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'HUONG-DAN.txt'
      - 'VALIDATION.txt'
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the pull request number, so every push to one pull request replaces the run of the previous push; a push to main keys on
# its ref. Only pull request runs are cancelled: a run on main always finishes, so a red main is never hidden by a newer commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub-tests:
    name: Hub tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        shell: bash
        working-directory: CHATMCP-HUB
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: CHATMCP-HUB/tests/requirements-e2e.txt
      - name: Install pinned FastAPI E2E dependencies
        run: python -m pip install -r tests/requirements-e2e.txt
      - name: Configure Git identity for tests that create repositories
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: Release source provenance regression
        run: python -m unittest discover -s ../scripts/tests -p test_release_source.py -v
      - name: Syntax check
        run: |
          for f in hub.mjs lib/*.mjs tests/*.mjs; do node --check "$f"; done
      # --retry-failed-once runs a suite that failed a second time. One that passes then is FLAKY: never PASS, a ::warning annotation, a line in
      # the step summary and a count in summary.json (docs/CI-HEALTH.md). The run is still red for a suite that fails twice.
      - name: Run all suites
        run: node tests/run-all.mjs --no-skip all --retry-failed-once --json test-results/summary.json
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-test-summary-${{ matrix.os }}-node${{ matrix.node }}
          path: CHATMCP-HUB/test-results/summary.json
          if-no-files-found: ignore

  flaky-gate:
    # A retry hides one timing accident, not a habit: this fails a run of main when FLAKY suites showed up in this run and in the two runs of main
    # before it (scripts/ci-flaky-gate.mjs reads the hub-test-summary-* artifacts of those runs; it only reads GitHub). Not for pull requests.
    name: Flaky suites (3 runs of main in a row fail)
    if: ${{ !cancelled() && needs.hub-tests.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: hub-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Download the summaries of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'hub-test-summary-*' --dir flaky-current
      - name: Fail when the last three runs of main each needed a retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-flaky-gate.mjs --current flaky-current --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --workflow CI --branch main --limit 3

  frontend-build:
    name: Frontend TypeScript / Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CHATMCP-HUB/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CHATMCP-HUB/ui/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Upload built ChatMCP UI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chatmcp-ui-dist
          path: CHATMCP-HUB/web/dist
          if-no-files-found: error

  react-e2e:
    name: React / real Local Hub E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: CHATMCP-HUB/ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CHATMCP-HUB/ui/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install headless Chromium and platform dependencies
        run: npx playwright install --with-deps chromium
      - name: React contract regression tests (no model API required)
        run: npm run test:unit
      - name: Build current React UI and run required E2E with a scripted provider
        run: npm run test:e2e
      - name: Upload React E2E results and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-e2e-${{ matrix.os }}
          path: CHATMCP-HUB/ui/test-results
          if-no-files-found: error

  windows-installer:
    name: Windows installer build (self-contained)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Compile and run the required Windows HOST-only supervisor fixture
        env:
          CHATMCP_REQUIRE_HOST_SUPERVISOR: '1'
        run: |
          dotnet build CHATMCP-HUB/windows/sandbox/GuestSupervisor/GuestSupervisor.csproj --configuration Debug --nologo
          node CHATMCP-HUB/tests/windows-sandbox/smoke.mjs
      - name: Required installer payload and cleanup regression tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\tests\Test-InstallerPayload.ps1
      # The classes the installer, the uninstaller and the desktop shell compile from native-shared/ and installer/ (Hub health and ownership, the session file, the
      # install transaction and its rollback, the update lock, the link filter, the Windows PowerShell child), on the real Windows file system. Until this step only
      # the publish workflows ran them, so a pull request never showed their result.
      - name: Native lifecycle unit tests (shared Hub lifecycle, install transaction, Windows PowerShell child)
        run: dotnet run --project scripts/tests/native-lifecycle/NativeLifecycle.Tests.csproj --configuration Release
      - name: Stage the locked intelligence runtime (the files the installer ships) for the real language-server test
        shell: bash
        run: |
          set -euo pipefail
          cd scripts/intelligence-runtime
          npm ci --ignore-scripts --no-audit --no-fund
          node stage.mjs "$RUNNER_TEMP/chatmcp-intelligence-runtime"
          node verify.mjs "$RUNNER_TEMP/chatmcp-intelligence-runtime"
      # Without this step CI only ever ran the stub language server. CHATMCP_REQUIRE_REAL_LSP=1 makes a missing real server a failure
      # (the test would otherwise print a skip line and still pass); CHATMCP_LSP_NODE_MODULES makes the staged runtime the only place it looks.
      - name: Real TypeScript and Pyright language servers through the production seam (a skipped server fails)
        shell: bash
        env:
          CHATMCP_REQUIRE_REAL_LSP: '1'
        run: |
          set -euo pipefail
          export CHATMCP_LSP_NODE_MODULES="$RUNNER_TEMP/chatmcp-intelligence-runtime/runtimes/lsp/node_modules"
          node CHATMCP-HUB/tests/verify-lsp-tier.mjs
      - name: Build fresh UI and Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Installer.ps1
      - name: Package Browser Companion and verify parity with installed payload
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-BrowserCompanion.ps1 -VerifyInstallerPayload
      - name: Required native WinForms / WebView2 smoke (current React + Local Hub)
        run: node CHATMCP-HUB/ui/e2e/webview2-smoke.mjs
      - name: Verify installer and checksum
        shell: powershell
        run: |
          if (-not (Test-Path .\dist\ChatMCPSetup.exe)) { throw 'Installer was not created' }
          if (-not (Test-Path .\dist\ChatMCPSetup.exe.sha256)) { throw 'Missing checksum' }
          $actual = (Get-FileHash .\dist\ChatMCPSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content .\dist\ChatMCPSetup.exe.sha256 -Raw).Trim() -split '\s+')[0]
          if ($actual -ne $expected) { throw 'Installer checksum verification failed' }
          $extensionZip = '.\dist\ChatMCP-Browser-Companion.zip'
          $extensionChecksum = "$extensionZip.sha256"
          if (-not (Test-Path $extensionZip) -or -not (Test-Path $extensionChecksum)) { throw 'Companion ZIP or checksum missing' }
          $extensionExpected = ((Get-Content $extensionChecksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $extensionActual = (Get-FileHash $extensionZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($extensionActual -ne $extensionExpected) { throw 'Companion ZIP checksum verification failed' }
      - name: Upload Windows installer build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChatMCPSetup-win-x64
          path: |
            dist/ChatMCPSetup.exe
            dist/ChatMCPSetup.exe.sha256
            dist/ChatMCP-Browser-Companion.zip
            dist/ChatMCP-Browser-Companion.zip.sha256
          if-no-files-found: error

  windows-upgrade-from-secretless-hub:
    # Releases up to v3.9.0 run a Hub without the per-launch secret. The installer preflight must still stop that Hub, then the
    # new Hub and the new shell must attach with the secret. Disposable hosted runner only (the lifecycle script refuses others).
    name: Windows upgrade from the published v3.9.0 (secretless Hub)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Installer preflight against the real v3.9.0 Hub from git
        run: node scripts/tests/legacy-hub-upgrade/run.mjs --baseline-ref 7f2551720fc65e95d1c2043adba7fde0dfececda
      - name: Build fresh UI and Windows installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Installer.ps1
      - name: Retrieve published hash-pinned upgrade baseline (v3.9.0)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v3.9.0 --repo $env:GITHUB_REPOSITORY --pattern ChatMCPSetup.exe --dir "$env:RUNNER_TEMP/native-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP/native-baseline/ChatMCPSetup.exe" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ef75e9a3721c5ba94a510de1ff00c1449031a4ac797570cb0d901861b509786e') { throw 'Baseline checksum mismatch' }
      - name: Real setup upgrade with the secretless v3.9.0 Hub running, then installed EXE lifecycle and uninstall
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-NativeLifecycle.ps1 -BaselineInstaller "$env:RUNNER_TEMP/native-baseline/ChatMCPSetup.exe" -CandidateInstaller dist/ChatMCPSetup.exe -ExpectedBaselineVersion 3.9.0 -ExpectedCandidateVersion 3.10.1 -OutputDirectory "$env:RUNNER_TEMP/native-lifecycle-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Installed EXE acceptance failed' }
      - name: Native WebView2 smoke (shell attaches with the secret; new-window payload runs no script)
        run: node CHATMCP-HUB/ui/e2e/webview2-smoke.mjs
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-lifecycle-evidence
          path: ${{ runner.temp }}/native-lifecycle-evidence
          if-no-files-found: ignore

  claims-map:
    # Claims-test rule (docs/CLAIMS.md): every headline claim is bound to a test that exercises the production path, or listed as unmapped,
    # and the number of unmapped claims may not grow. On a pull request the ratchet is also compared with the base branch.
    name: Claims map (unmapped count may not grow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Claims map against the base branch
        if: github.event_name == 'pull_request'
        working-directory: CHATMCP-HUB
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tests/verify-claims-map.mjs --base "origin/$BASE_REF"
      - name: Claims map
        if: github.event_name != 'pull_request'
        working-directory: CHATMCP-HUB
        run: node tests/verify-claims-map.mjs

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No tracked file may match an ignore rule
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked_ignored" ]; then
            echo "Tracked files that .gitignore says must not be committed:"
            echo "$tracked_ignored" | head -50
            exit 1
          fi
      - name: No bearer tokens or private keys in tracked files
        run: |
          if git grep -I -n -E 'Authorization"?[:=] *"?Bearer [A-Za-z0-9._~+/=-]{24,}|-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' -- . ':(exclude)scripts/tests' ':(exclude)CHATMCP-HUB/tests' ':(exclude)docs' ':(exclude).github'; then
            echo "A credential-looking value is tracked. Remove it and rotate the credential."
            exit 1
          fi
