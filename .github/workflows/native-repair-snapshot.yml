# Temporary read-only source export for the user-authorized direct-main repair.
# Removed by the release commit; no credentials, untracked files or user state.
name: Native repair source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-repair-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Archive tracked source at the exact repair base
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-repair-source
          path: source.zip
          if-no-files-found: error
          retention-days: 2
