# Publish ChatMCP v3.5.0 only after the versioned release commit reaches main.
# User-authorized release: test the exact release commit. A fresh Windows
# installer build and SHA-256 verification are still required before publication.
name: Publish ChatMCP v3.5.0

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-chatmcp-v3.5.0
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ChatMCP v3.5.0
    if: >-
      ${{ startsWith(github.event.head_commit.message, 'release: ChatMCP v3.5.0') }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v3.5.0
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Guard release commit and version alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Wrong checked-out commit' }
          $main = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($main -ne $env:GITHUB_SHA) { throw 'main moved since release commit; refusing stale release' }
          if ((git show -s --format=%s HEAD).Trim() -ne 'release: ChatMCP v3.5.0') { throw 'Wrong release commit title' }
          $hub = (Get-Content DATGOLD-HUB/package.json -Raw | ConvertFrom-Json).version
          $ui = (Get-Content DATGOLD-HUB/ui/package.json -Raw | ConvertFrom-Json).version
          $lock = (node -p "require('./DATGOLD-HUB/ui/package-lock.json').version").Trim()
          if ($hub -ne '3.5.0' -or $ui -ne '3.5.0' -or $lock -ne '3.5.0') { throw 'Version mismatch: Hub/UI/lockfile' }
          if (-not (Get-Content desktop-shell/ChatMCP.csproj -Raw).Contains('<Version>3.5.0</Version>')) { throw 'Desktop version mismatch' }
          if (-not (Get-Content installer/ChatMCP.Installer.csproj -Raw).Contains('<Version>3.5.0</Version>')) { throw 'Installer version mismatch' }
          if (-not (Test-Path RELEASE-NOTES-v3.5.0.md)) { throw 'Missing release notes' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify pinned release metadata and regression suites
        shell: pwsh
        run: |
          python -m pip install -r DATGOLD-HUB/tests/requirements-e2e.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test dependencies failed to install' }
          git config --global user.email 'ci@example.invalid'
          git config --global user.name 'ci'
          node DATGOLD-HUB/tests/run-all.mjs --no-skip all
          if ($LASTEXITCODE -ne 0) { throw 'Release Hub regression suite failed' }
      - name: Build self-contained Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer failed with exit code $LASTEXITCODE" }
      - name: Native Windows WebView2 smoke test
        shell: pwsh
        run: |
          node DATGOLD-HUB/ui/e2e/webview2-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 smoke test failed' }
      - name: Verify SHA-256 of built installer
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ChatMCPSetup.exe)) { throw 'Installer missing' }
          if (-not (Test-Path dist/ChatMCPSetup.exe.sha256)) { throw 'Checksum missing' }
          $expected = ((Get-Content dist/ChatMCPSetup.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash dist/ChatMCPSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 mismatch; refusing release' }
          Write-Host "Installer verified SHA-256: $actual"
      - name: Upload verified installer workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChatMCPSetup-v3.5.0-win-x64
          path: |
            dist/ChatMCPSetup.exe
            dist/ChatMCPSetup.exe.sha256
          if-no-files-found: error
      - name: Create annotated tag and public GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existingTag = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($existingTag) {
            git fetch origin "refs/tags/$env:TAG:refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch existing release tag' }
            if ((git rev-list -n 1 $env:TAG).Trim() -ne $env:GITHUB_SHA) { throw 'Release tag exists at a different commit' }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:TAG -m 'ChatMCP v3.5.0 - Concurrent Coding Workspace' $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create version tag' }
            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to publish version tag' }
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite assets' }
          gh release create $env:TAG dist/ChatMCPSetup.exe dist/ChatMCPSetup.exe.sha256 --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title 'ChatMCP v3.5.0 - Concurrent Coding Workspace' --notes-file RELEASE-NOTES-v3.5.0.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
