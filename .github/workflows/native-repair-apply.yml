# Temporary user-authorized main repair; removed by the release commit.
name: Verify native lifecycle repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-repair-apply.yml', 'scripts/maintenance/native-repair/**']
permissions:
  contents: read
concurrency:
  group: native-repair-v3.8.3
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_tree: ${{ steps.source.outputs.source_tree }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply hash-verified source patches
        id: source
        run: python scripts/maintenance/native-repair/apply.py
      - name: Real Chromium MV3 delivery IPC with fixture-owned pairing
        working-directory: CHATMCP-HUB/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test e2e/companion-ipc.spec.mjs --workers=1 --reporter=line
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-repair-browser-evidence
          path: CHATMCP-HUB/ui/test-results
          if-no-files-found: warn
  repair:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      source_tree: ${{ steps.source.outputs.source_tree }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply hash-verified source patches
        id: source
        run: |
          python scripts/maintenance/native-repair/apply.py
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed patch failed' }
      - name: Native shared code and transaction rollback regression
        run: |
          dotnet run --project scripts/tests/native-lifecycle/NativeLifecycle.Tests.csproj --configuration Release 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-repair-evidence/native-unit.log"
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle and rollback tests failed' }
          powershell -NoProfile -File scripts/tests/Test-InstallerPayload.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload regression failed' }
      - name: Complete no-skip Hub regression suite
        run: |
          python -m pip install -r CHATMCP-HUB/tests/requirements-e2e.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          git config --global user.email 'ci@example.invalid'
          git config --global user.name 'ci'
          node --check CHATMCP-HUB/extension/browser-runner.js
          if ($LASTEXITCODE -ne 0) { throw 'Content script syntax failed' }
          node --check CHATMCP-HUB/extension/browser-background.js
          if ($LASTEXITCODE -ne 0) { throw 'Service worker syntax failed' }
          node CHATMCP-HUB/tests/run-all.mjs --no-skip all --json "$env:RUNNER_TEMP/native-repair-evidence/node-summary.json" 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-repair-evidence/node-all.log"
          if ($LASTEXITCODE -ne 0) { throw 'Hub regression suite failed' }
      - name: Build fresh candidate Windows installer
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Build-Installer.ps1 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-repair-evidence/build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed' }
      - name: Download hash-pinned published baseline installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.8.2 --repo pddczpl/ChatMCP --pattern ChatMCPSetup.exe --dir "$env:RUNNER_TEMP/native-baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          $hash=(Get-FileHash "$env:RUNNER_TEMP/native-baseline/ChatMCPSetup.exe" -Algorithm SHA256).Hash
          if ($hash -ne '75bd3085f73af083d772b675729376d2702448f8a8dc4fe94a9cd58ed80d5564') { throw 'Baseline hash mismatch' }
      - name: Actual installed EXE upgrade, single-instance, Hub lifetime and uninstall
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Test-NativeLifecycle.ps1 -BaselineInstaller "$env:RUNNER_TEMP/native-baseline/ChatMCPSetup.exe" -CandidateInstaller "dist/ChatMCPSetup.exe" -OutputDirectory "$env:RUNNER_TEMP/native-repair-evidence/installed-lifecycle"
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed native lifecycle acceptance failed' }
      - name: Existing native WebView2 smoke and extension package parity
        run: |
          node CHATMCP-HUB/ui/e2e/webview2-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 smoke failed' }
          powershell -NoProfile -File scripts/Build-BrowserCompanion.ps1 -VerifyInstallerPayload
          if ($LASTEXITCODE -ne 0) { throw 'Companion parity failed' }
      - name: Preserve actual native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-repair-evidence
          path: ${{ runner.temp }}/native-repair-evidence
          if-no-files-found: warn
  commit:
    needs: [browser, repair]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Commit the identical tested source tree to main without force
        env:
          BROWSER_TREE: ${{ needs.browser.outputs.source_tree }}
          NATIVE_TREE: ${{ needs.repair.outputs.source_tree }}
        run: |
          set -euo pipefail
          python scripts/maintenance/native-repair/apply.py
          test "$(git write-tree)" = "$BROWSER_TREE"
          test "$(git write-tree)" = "$NATIVE_TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: native lifecycle and safe Companion delivery for v3.8.3' -m 'User-authorized direct-main fix. Windows native rollback and installed EXE upgrade/lifecycle/uninstall plus full no-skip Hub regression; actual scripted Chromium MV3 delivery IPC. Both jobs verified this exact source tree. No live signed-in Edge claim.'
          git push origin HEAD:main
