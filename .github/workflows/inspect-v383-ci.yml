name: Inspect interrupted v3.8.3 CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v383-ci.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Capture original GitHub Actions logs as bytes
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/chatmcp-v383-inspection"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39012442256/jobs?per_page=100" > "$evidence/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39012442256/logs" > "$evidence/run-logs.zip"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$evidence/main.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v3.8.3" > "$evidence/tag.json" 2> "$evidence/tag.stderr" || true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v3.8.3" > "$evidence/release.json" 2> "$evidence/release.stderr" || true
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'chatmcp-v383-inspection'
          jobs = json.loads((root / 'jobs.json').read_text())
          for job in jobs['jobs']:
              print(job['id'], job['name'], job['conclusion'])
              for step in job.get('steps', []):
                  if step.get('conclusion') == 'failure':
                      print('FAILED STEP:', step['number'], step['name'])
          with zipfile.ZipFile(root / 'run-logs.zip') as archive:
              for name in archive.namelist():
                  if name.endswith('.txt'):
                      text = archive.read(name).decode('utf-8-sig', errors='replace')
                      if '##[error]' in text or 'Traceback' in text or 'AssertionError' in text:
                          print('\nLOG:', name)
                          print('\n'.join(text.splitlines()[-65:]))
          PY
      - name: Upload original failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChatMCP-v383-original-failure-logs
          path: ${{ runner.temp }}/chatmcp-v383-inspection
          if-no-files-found: error
          retention-days: 7
