# User-authorized one-shot repair. Release commit removes this bootstrap.
name: Repair ChatGPT Web delivery on main
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: repair-web-delivery-v3.8.2
  cancel-in-progress: false
jobs:
  repair:
    if: >-
      ${{ startsWith(github.event.head_commit.message, 'maintenance: repair Web delivery v3.8.2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare pinned test environment
        run: |
          python -m pip install -r CHATMCP-HUB/tests/requirements-e2e.txt
          git config --global user.email 'ci@example.invalid'
          git config --global user.name 'ci'
      - name: Reproduce queued task starvation before changing runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/web-delivery-proof
          python scripts/maintenance/web-delivery-v3.8.2.py --tests-only
          node --check CHATMCP-HUB/tests/verify-browser-delivery-readiness.mjs
          set +e
          node CHATMCP-HUB/tests/verify-browser-delivery-readiness.mjs > /tmp/web-delivery-proof/before.log 2>&1
          result=$?
          set -e
          cat /tmp/web-delivery-proof/before.log
          test "$result" -ne 0
          grep -F 'recovery must not starve queued task' /tmp/web-delivery-proof/before.log
      - name: Apply checked-source repair and run regression suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/maintenance/web-delivery-v3.8.2.py
          python - <<'PY'
          from pathlib import Path
          for name in ('README.md', 'docs/DEVELOPMENT.md'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              assert '91 bộ Node' in text, 'Review changed suite-count documentation: ' + name
              p.write_text(text.replace('91 bộ Node', '92 bộ Node'), encoding='utf-8', newline='\n')
          PY
          node --check CHATMCP-HUB/extension/browser-background.js
          node --check CHATMCP-HUB/extension/browser-runner.js
          node --check CHATMCP-HUB/lib/browser-runner.mjs
          node CHATMCP-HUB/tests/verify-browser-delivery-readiness.mjs | tee /tmp/web-delivery-proof/after.log
          node CHATMCP-HUB/tests/run-all.mjs --no-skip all --json /tmp/web-delivery-proof/summary.json | tee /tmp/web-delivery-proof/all.log
          git diff --check
          git diff --stat | tee /tmp/web-delivery-proof/diff-stat.txt
          git diff > /tmp/web-delivery-proof/repair.patch
      - name: Retain actual red/green test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-delivery-v3.8.2-test-evidence
          path: /tmp/web-delivery-proof
          if-no-files-found: error
      - name: Commit tested runtime changes directly to main without force
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          # The connector publishes workflow changes separately. GITHUB_TOKEN
          # needs only contents:write here; it does not edit workflow files.
          git add CHATMCP-HUB scripts/Build-BrowserCompanion.ps1 desktop-shell installer README.md SECURITY.md CHANGELOG.md RELEASE-NOTES-v3.8.2.md docs/DEVELOPMENT.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore ChatGPT Web task delivery and prepare v3.8.2' -m 'User-authorized direct-main repair. New starvation regression fails on the previous runtime and passes after the repair. Full no-skip Node suite passed in this workflow. No live signed-in Edge claim.'
          git push origin HEAD:main
          echo "Tested repair commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
