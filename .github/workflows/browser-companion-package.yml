name: Browser Companion Release Package

# One run per push: no branch-pinned push trigger (it started this workflow twice for every push to that branch); main and pull requests only.
on:
  push:
    branches: [main]
    paths:
      - 'DATGOLD-HUB/extension/**'
      - 'scripts/Build-BrowserCompanion.ps1'
      - 'scripts/InstallerPayload.ps1'
      - '.github/workflows/browser-companion-package.yml'
  pull_request:
    paths:
      - 'DATGOLD-HUB/extension/**'
      - 'scripts/Build-BrowserCompanion.ps1'
      - 'scripts/InstallerPayload.ps1'
      - '.github/workflows/browser-companion-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-zip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension-zip:
    name: Package verified Chrome/Edge Hub Companion ZIP
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build standalone extension from canonical MV3 sources
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-BrowserCompanion.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Browser Companion package failed' }
      - name: Validate ZIP and checksum
        shell: powershell
        run: |
          # The archive under its new name and, as a copy, under the old name that every installed version links to.
          $digests = @()
          foreach ($zip in @('.\dist\DatGold-Browser-Companion.zip', '.\dist\ChatMCP-Browser-Companion.zip')) {
            if (-not (Test-Path $zip)) { throw "Missing standalone extension ZIP: $zip" }
            if (-not (Test-Path "$zip.sha256")) { throw "Missing extension checksum: $zip" }
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            if ($sha -ne $expected) { throw "Extension checksum does not match: $zip" }
            $digests += $sha
          }
          if (@($digests | Select-Object -Unique).Count -ne 1) { throw 'The archive under its two names is not the same file' }
          $zip = '.\dist\DatGold-Browser-Companion.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if ($null -eq $archive.GetEntry('manifest.json')) { throw 'Archive root is missing manifest.json' }
            if ($null -eq $archive.GetEntry('browser-background.js')) { throw 'Archive is not DatGold Hub Companion' }
          } finally { $archive.Dispose() }
      - name: Upload standalone browser extension test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DatGold-Browser-Companion-verified
          path: |
            dist/DatGold-Browser-Companion.zip
            dist/DatGold-Browser-Companion.zip.sha256
            dist/ChatMCP-Browser-Companion.zip
            dist/ChatMCP-Browser-Companion.zip.sha256
          if-no-files-found: error
