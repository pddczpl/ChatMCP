# Publish only a user-authorized versioned release commit on main.
name: Publish ChatMCP v3.8.2

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-chatmcp-v3.8.2
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ChatMCP v3.8.2
    if: >-
      ${{ startsWith(github.event.head_commit.message, 'release: ChatMCP v3.8.2') }}
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v3.8.2
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Guard release commit and version alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Wrong checked-out commit' }
          $main = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($main -ne $env:GITHUB_SHA) { throw 'main moved since release commit; refusing stale release' }
          if ((git show -s --format=%s HEAD).Trim() -ne 'release: ChatMCP v3.8.2') { throw 'Wrong release commit title' }
          $hub = (Get-Content CHATMCP-HUB/package.json -Raw | ConvertFrom-Json).version
          $ui = (Get-Content CHATMCP-HUB/ui/package.json -Raw | ConvertFrom-Json).version
          $lock = (node -p "require('./CHATMCP-HUB/ui/package-lock.json').version").Trim()
          if ($hub -ne '3.8.2' -or $ui -ne '3.8.2' -or $lock -ne '3.8.2') { throw 'Version mismatch: Hub/UI/lockfile' }
          if (-not (Get-Content desktop-shell/ChatMCP.csproj -Raw).Contains('<Version>3.8.2</Version>')) { throw 'Desktop version mismatch' }
          if (-not (Get-Content installer/ChatMCP.Installer.csproj -Raw).Contains('<Version>3.8.2</Version>')) { throw 'Installer version mismatch' }
          if (-not (Test-Path RELEASE-NOTES-v3.8.2.md)) { throw 'Missing release notes' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify pinned release metadata and regression suites
        shell: pwsh
        run: |
          python -m pip install -r CHATMCP-HUB/tests/requirements-e2e.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test dependencies failed to install' }
          git config --global user.email 'ci@example.invalid'
          git config --global user.name 'ci'
          node CHATMCP-HUB/tests/run-all.mjs --no-skip all
          if ($LASTEXITCODE -ne 0) { throw 'Release Hub regression suite failed' }
      - name: Build self-contained Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Build-Installer failed with exit code $LASTEXITCODE" }
      - name: Native Windows WebView2 smoke test
        shell: pwsh
        run: |
          node CHATMCP-HUB/ui/e2e/webview2-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 smoke test failed' }
      - name: Build and verify matching Browser Companion 1.5.1 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content CHATMCP-HUB/extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3 -or $manifest.version -ne '1.5.1') { throw 'Companion extension version/manifest mismatch' }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-BrowserCompanion.ps1 -VerifyInstallerPayload
          if ($LASTEXITCODE -ne 0) { throw 'Browser Companion ZIP/package parity validation failed' }
          $zip = 'dist/ChatMCP-Browser-Companion.zip'
          $check = "$zip.sha256"
          if (-not (Test-Path $zip) -or -not (Test-Path $check)) { throw 'Browser Companion ZIP/checksum missing' }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content $check -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Browser Companion SHA-256 mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            if ($null -eq $archive.GetEntry('manifest.json') -or $null -eq $archive.GetEntry('browser-background.js')) {
              throw 'Browser Companion ZIP missing required root entries'
            }
          } finally { $archive.Dispose() }
          Write-Host "Companion 1.5.1 verified SHA-256: $actual"
      - name: Verify SHA-256 of built installer
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ChatMCPSetup.exe)) { throw 'Installer missing' }
          if (-not (Test-Path dist/ChatMCPSetup.exe.sha256)) { throw 'Checksum missing' }
          $expected = ((Get-Content dist/ChatMCPSetup.exe.sha256 -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash dist/ChatMCPSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 mismatch; refusing release' }
          Write-Host "Installer verified SHA-256: $actual"
      - name: Upload verified installer and Browser Companion release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChatMCP-v3.8.2-Windows-and-Companion
          path: |
            dist/ChatMCPSetup.exe
            dist/ChatMCPSetup.exe.sha256
            dist/ChatMCP-Browser-Companion.zip
            dist/ChatMCP-Browser-Companion.zip.sha256
          if-no-files-found: error
      - name: Create annotated tag and public GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = ((git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($main -ne $env:GITHUB_SHA) { throw 'main moved during build; refusing stale release' }
          $existingTag = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($existingTag) {
            git fetch origin "refs/tags/$env:TAG:refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch existing release tag' }
            if ((git rev-list -n 1 $env:TAG).Trim() -ne $env:GITHUB_SHA) { throw 'Release tag exists at a different commit' }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:TAG -m 'ChatMCP v3.8.2 - ChatGPT Web Delivery Repair' $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create version tag' }
            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to publish version tag' }
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite assets' }
          gh release create $env:TAG dist/ChatMCPSetup.exe dist/ChatMCPSetup.exe.sha256 dist/ChatMCP-Browser-Companion.zip dist/ChatMCP-Browser-Companion.zip.sha256 --repo $env:GITHUB_REPOSITORY --verify-tag --latest --title 'ChatMCP v3.8.2 - ChatGPT Web Delivery Repair' --notes-file RELEASE-NOTES-v3.8.2.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
